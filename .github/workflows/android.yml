name: SlimoTV - Android debug APK
on:
  push:
    branches: [master]
  workflow_dispatch:

# Permission nécessaire pour créer le tag et joindre l'APK à une GitHub Release.
permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Compile web application
        run: npm run build
      - name: Create Android project
        run: npx cap add android
      - name: Register native IR plugin and sync
        run: npm run android:sync
      - name: Assemble debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
      - name: Upload installable debug APK
        uses: actions/upload-artifact@v4
        with:
          name: SlimoTV-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
      - name: Publish versioned GitHub prerelease
        if: github.event_name == 'push' && github.ref == 'refs/heads/master'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="v$(node -p "require('./package.json').version")"
          if gh release view "$VERSION" >/dev/null 2>&1; then
            echo "Release $VERSION already exists; it will not be overwritten."
            exit 0
          fi
          APK="SlimoTV-${VERSION}.apk"
          cp android/app/build/outputs/apk/debug/app-debug.apk "$APK"
          printf '%s\n' \
            'Version de test pour LG 42CS460-ZA (2012).' \
            '' \
            '- Marche / Arrêt, Volume + et Volume -.' \
            '- Codes NEC1 LG de départ, émission infrarouge à 38 kHz.' \
            '- Réglages avancés pour modifier chaque code IR et les conserver localement.' \
            '' \
            'Les codes et le fonctionnement réel n’ont pas encore été validés sur le téléviseur.' \
            > release-notes.md
          gh release create "$VERSION" "$APK" \
            --target "$GITHUB_SHA" \
            --title "SlimoTV $VERSION - Version de test" \
            --notes-file release-notes.md \
            --prerelease
